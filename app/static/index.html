<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGN Route</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://unpkg.com/ol@9.2.4/ol.css"/>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link rel="stylesheet" href="app.css?v=3">
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- UI Overlay: Screen 1 (Search & Plan) -->
    <div id="screen-search" class="ui-overlay active">
        <div class="search-panel soft-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h1 class="app-title" style="margin-bottom: 0;"><i class="ph-fill ph-map-pin" style="color: var(--accent-primary);"></i> SGN Route</h1>
                <div>
                    <button id="btn-toggle-search" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-main);"><i class="ph-bold ph-caret-down"></i></button>
                </div>
            </div>
            
            <div class="input-group">
                <div class="input-icon" style="color: #10b981;"><i class="ph-fill ph-navigation-arrow"></i></div>
                <input type="text" id="input-origin" placeholder="Chọn điểm đi..." autocomplete="off">
                <div class="clear-btn" onclick="clearInput('origin')"><i class="ph-bold ph-x"></i></div>
            </div>
            
            <div class="route-line"></div>
            
            <div class="input-group">
                <div class="input-icon" style="color: #ef4444;"><i class="ph-fill ph-map-pin"></i></div>
                <input type="text" id="input-destination" placeholder="Chọn điểm đến..." autocomplete="off">
                <div class="clear-btn" onclick="clearInput('destination')"><i class="ph-bold ph-x"></i></div>
            </div>

            <!-- Autocomplete Suggestions Box -->
            <div id="suggestions-box" class="suggestions-box hidden">
                <!-- Suggestions will be populated here -->
            </div>
            
            <!-- Recent Routes (Shown by default) -->
            <div id="recent-routes-box" class="recent-routes-box">
                <h3 class="section-title">Đã tìm gần đây</h3>
                <div id="recent-routes-list" class="recent-routes-list">
                    <div class="empty-state">Đang tải lịch sử...</div>
                </div>
            </div>
            
            <!-- Route Info (Shown after clicking Đường đi) -->
            <div id="route-info-box" class="route-info-box hidden" style="margin-top: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 12px; border-radius: 12px; border: 1px solid var(--border-color);">
                    <div>
                        <div style="font-size: 24px; font-weight: 700; color: #10b981;" id="info-eta">-- phút</div>
                        <div style="font-size: 14px; color: var(--text-muted);" id="info-dist">-- km</div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button id="btn-cancel-route" class="btn" style="padding: 10px; font-size: 14px; flex: 0 0 auto; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);"><i class="ph-bold ph-x"></i></button>
                        <button id="btn-start-nav-from-info" class="btn btn-primary" style="padding: 10px 20px; font-size: 14px; flex: 0 1 auto;">Dẫn đường</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- FAB Location Button -->
        <button id="btn-my-location-fab" class="fab-btn hidden"><i class="ph-fill ph-crosshair"></i></button>

        <!-- Action Buttons (Hidden until origin and destination are set) -->
        <div id="action-buttons" class="action-buttons hidden soft-card">
            <button id="btn-show-route" class="btn btn-secondary">Đường đi</button>
            <button id="btn-navigate" class="btn btn-primary">Dẫn đường</button>
        </div>
    </div>

    <!-- UI Overlay: Screen 2 (Navigation) -->
    <div id="screen-navigation" class="ui-overlay hidden">
        <div class="nav-footer soft-card">
            <div class="nav-stats">
                <div class="stat-time" id="nav-eta">-- phút</div>
                <div class="stat-dist" id="nav-total-dist">-- km</div>
            </div>
            <button id="btn-sim-mode" class="btn-icon"><i class="ph-bold ph-game-controller"></i> Giả lập</button>
            <button id="btn-recenter" class="btn-icon"><i class="ph-fill ph-crosshair"></i> Ghim</button>
            <button id="btn-rescue-gmaps" class="btn-icon btn-rescue"><i class="ph-bold ph-warning"></i> Cứu hộ</button>
            <button id="btn-stop-nav" class="btn-icon"><i class="ph-bold ph-x"></i> Thoát</button>
        </div>
    </div>

    <!-- UI Overlay: Map Picker -->
    <div id="map-picker-ui" class="hidden">
        <div class="crosshair"><i class="ph-bold ph-crosshair" style="font-size: 24px;"></i></div>
        <div class="picker-footer soft-card">
            <button id="btn-confirm-location" class="btn btn-primary">Xác nhận</button>
            <button id="btn-cancel-picker" class="btn btn-secondary">Hủy</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen hidden">
        <div class="spinner"></div>
        <p>Đang tìm đường đi tốt nhất...</p>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">Lệch tuyến! Đang tính lại đường...</div>

    <!-- OpenLayers JS -->
    <script src="https://unpkg.com/ol@9.2.4/dist/ol.js"></script>
    <script src="app.js?v=10"></script>
    <script>
        // Register Service Worker for offline caching
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js').then((reg) => {
                console.log('SW registered:', reg.scope);
            }).catch((err) => {
                console.warn('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
